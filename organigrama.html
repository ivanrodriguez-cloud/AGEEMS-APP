<!DOCTYPE html>

  <!-- GUARDIÁN DE SESIÓN EN PRIMERA LÍNEA -->
  <script>
    (function() {
      const userSession = sessionStorage.getItem("userSession");
      if (!userSession) {
        alert("Acceso denegado. Debes iniciar sesión para acceder al Organigrama.");
        window.location.href = "index.html";
        return;
      }
      try {
        const user = JSON.parse(userSession);
        if (!user || !user.correo) {
          throw new Error("Sesión inválida");
        }

        const rolUsuario = user.rol ? user.rol.toString().toUpperCase() : "";
        const rolesPermitidos = ["ADMINISTRADOR", "DIRECTOR", "USUARIO", "VISUALIZADOR"];

        if (!rolesPermitidos.includes(rolUsuario)) {
          alert("Acceso denegado. No tienes permisos para acceder al Organigrama.");
          window.location.href = "index.html";
          return;
        }
      } catch (e) {
        sessionStorage.removeItem("userSession");
        window.location.href = "index.html";
      }
    })();
  </script>

  <div class="container">

    <!-- BOTÓN AGENDAR CUMPLEAÑOS -->
    <button id="btnAbrirCumpleanos" class="btn-cumpleanos" style="display: none;" onclick="togglePanelCumpleanos()">

    </button>

    <!-- PANEL DE CONFIGURACIÓN DE CUMPLEAÑOS -->
    <div id="panelCumpleanos" class="panel-cumpleanos">
      <h3>Configurar Cumpleaños en Google Calendar</h3>
      <div class="grid-cumpleanos">
        
        <div class="form-group-cumple">
          <label>Años a considerar (Selecciona uno o varios):</label>
          <select id="selectAnos" class="select-multiple" multiple></select>

  <script>
    const URL_SCRIPT_DIRECTORIO = "https://script.google.com/macros/s/AKfycbydAlhc1CbJhdHry5DrlOgWEr9IqLV7bJGhBssTQBGK5ftGS6yZLUyJU2D_UTCeIyhtwg/exec";
    
    // CLIENT ID OAUTH DE GOOGLE CLOUD
    const CLIENT_ID_OAUTH = "287359960751-l4p24dep46nrtc41if0n8naabn1vi1lu.apps.googleusercontent.com";
    const SCOPES_CALENDAR = "https://www.googleapis.com/auth/calendar.events";

    let datosGlobales = [];
    let usuarioLogueado = null;
    let tokenClientCalendar = null;
    let gapiCalendarIniciado = false;

    window.onload = function() {
      validarRolYBotonCumpleanos();
      obtenerDatosDirectorio();
      inicializarListaAnos();
      inicializarGoogleCalendarSDK();
    };

    function inicializarGoogleCalendarSDK() {
      if (typeof gapi !== 'undefined') {
        gapi.load('client', async () => {
          await gapi.client.init({
            discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'],
          });
          gapiCalendarIniciado = true;
        });
      }
      if (typeof google !== 'undefined' && google.accounts && google.accounts.oauth2) {
        tokenClientCalendar = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID_OAUTH,
          scope: SCOPES_CALENDAR,
          callback: '', 
        });
      }
    }

    function validarRolYBotonCumpleanos() {
      const userSession = sessionStorage.getItem("userSession");
      if (userSession) {
        usuarioLogueado = JSON.parse(userSession);
        const rol = usuarioLogueado.rol ? usuarioLogueado.rol.toString().toUpperCase() : "";
        const rolesPermitidosBtn = ["ADMINISTRADOR", "DIRECTOR", "USUARIO"];
        if (rolesPermitidosBtn.includes(rol)) {
          document.getElementById('btnAbrirCumpleanos').style.display = 'inline-flex';
        }
      }
    }

    function inicializarListaAnos() {
      const selectAnos = document.getElementById('selectAnos');
      selectAnos.innerHTML = '';
      const anioActual = new Date().getFullYear();
      for (let i = 0; i < 5; i++) {
        const option = document.createElement('option');
        option.value = anioActual + i;
        option.textContent = anioActual + i;
        if (i === 0) option.selected = true;
        selectAnos.appendChild(option);
      }
    }

    function togglePanelCumpleanos() {
      const panel = document.getElementById('panelCumpleanos');
      panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
    }

    function toggleAlerta(btn) {
      btn.classList.toggle('active');
    }

    function obtenerDatosDirectorio() {
      fetch(`${URL_SCRIPT_DIRECTORIO}?v=${Date.now()}`, { method: 'GET', redirect: 'follow' })
        .then(response => response.json())
        .then(data => {
          if (Array.isArray(data)) {
            datosGlobales = data;
            poblarSelectPersonas(datosGlobales);
            renderizarOrganigramaJerarquico(datosGlobales);
          } else {
            document.getElementById('organigramaContainer').innerHTML = `<p style="text-align:center; color:red;">No se pudieron cargar los datos.</p>`;
          }
        })
        .catch(err => {
          console.error("Error al obtener datos:", err);
          document.getElementById('organigramaContainer').innerHTML = `<p style="text-align:center; color:red;">Ocurrió un error al conectar con el servidor.</p>`;
        });
    }

    function poblarSelectPersonas(lista) {
      const select = document.getElementById('selectPersonas');
      select.innerHTML = '';

      const personasOrdenadas = [...lista].sort((a, b) => {
        const nomA = obtenerValor(a, ["NOMBRE PÚBLICO", "NOMBRE COMPLETO", "NOMBRE"]);
        const nomB = obtenerValor(b, ["NOMBRE PÚBLICO", "NOMBRE COMPLETO", "NOMBRE"]);
        return nomA.localeCompare(nomB);
      });

      personasOrdenadas.forEach(p => {
        const nombre = obtenerValor(p, ["NOMBRE PÚBLICO", "NOMBRE COMPLETO", "NOMBRE"]);
        const curp = obtenerValor(p, ["CURP"]);
        if (nombre && curp) {
          const opt = document.createElement('option');
          opt.value = curp;
          opt.textContent = nombre;
          select.appendChild(opt);
        }
      });
    }

    // MANEJO DE CUMPLEAÑOS DIRECTAMENTE EN NAVEGADOR (CON PERMISO DE GOOGLE)
    function procesarCumpleanos(tipoAccion) {
      const selectAnos = document.getElementById('selectAnos');
      const anosSeleccionados = Array.from(selectAnos.selectedOptions).map(opt => opt.value);

      const selectPersonas = document.getElementById('selectPersonas');
      const personasSeleccionadas = Array.from(selectPersonas.selectedOptions).map(opt => ({
        nombre: opt.textContent,
        curp: opt.value
      }));

      if (anosSeleccionados.length === 0) {
        alert("Por favor selecciona al menos un año.");
        return;
      }

      if (personasSeleccionadas.length === 0) {
        alert("Por favor selecciona al menos una persona.");
        return;
      }

      const alertaUnDia = document.getElementById('btnAlertaUnDia').classList.contains('active');
      const alertaMismoDia = document.getElementById('btnAlertaMismoDia').classList.contains('active');

      if (!tokenClientCalendar || !gapiCalendarIniciado) {
        inicializarGoogleCalendarSDK();
      }

      // Función que realiza la llamada a Google Calendar API del usuario
      const ejecutarAccionCalendar = async () => {
        const btnProcesar = event.target;
        const textoOriginal = btnProcesar.textContent;
        btnProcesar.disabled = true;
        btnProcesar.textContent = "Procesando...";

        try {
          let exitosos = 0;
          let yaAgendados = [];
          let noEncontrados = [];

          for (let persona of personasSeleccionadas) {
            const curp = persona.curp ? persona.curp.toString().trim() : "";
            const nombre = persona.nombre ? persona.nombre.toString().trim() : "Personal";
            if (curp.length < 10) continue;

            const mesStr = curp.substring(6, 8);
            const diaStr = curp.substring(8, 10);

            for (let anio of anosSeleccionados) {
              const fechaStr = `${anio}-${mesStr}-${diaStr}`;
              const tituloEvento = `Cumpleaños de ${nombre}`;

              // Buscar si ya existe el evento en esa fecha
              const resList = await gapi.client.calendar.events.list({
                'calendarId': 'primary',
                'timeMin': `${fechaStr}T00:00:00Z`,
                'timeMax': `${fechaStr}T23:59:59Z`,
                'q': tituloEvento,
                'singleEvents': true
              });

              const eventoExistente = resList.result.items.find(e => e.summary.toLowerCase() === tituloEvento.toLowerCase());

              if (tipoAccion === 'agregar') {
                if (eventoExistente) {
                  yaAgendados.push(nombre);
                } else {
                  let overrides = [];
                  if (alertaUnDia) overrides.push({ method: 'popup', minutes: 840 });
                  if (alertaMismoDia) overrides.push({ method: 'popup', minutes: 0 });

                  const nuevoEvento = {
                    'summary': tituloEvento,
                    'start': { 'date': fechaStr },
                    'end': { 'date': fechaStr },
                    'reminders': {
                      'useDefault': false,
                      'overrides': overrides
                    }
                  };

                  await gapi.client.calendar.events.insert({
                    'calendarId': 'primary',
                    'resource': nuevoEvento
                  });
                  exitosos++;
                }
              } else if (tipoAccion === 'eliminar') {
                if (eventoExistente) {
                  await gapi.client.calendar.events.delete({
                    'calendarId': 'primary',
                    'eventId': eventoExistente.id
                  });
                  exitosos++;
                } else {
                  noEncontrados.push(nombre);
                }
              }
            }
          }

          btnProcesar.disabled = false;
          btnProcesar.textContent = textoOriginal;

          if (tipoAccion === 'agregar') {
            let msg = `Proceso completado. Cumpleaños agendados correctamente: ${exitosos}.`;
            if (yaAgendados.length > 0) {
              msg += `\n\nLos siguientes ya estaban agendados:\n- ` + [...new Set(yaAgendados)].join("\n- ");
            }
            alert(msg);
          } else {
            let msg = `Proceso completado. Cumpleaños eliminados correctamente: ${exitosos}.`;
            if (noEncontrados.length > 0) {
              msg += `\n\nLos siguientes no estaban agendados:\n- ` + [...new Set(noEncontrados)].join("\n- ");
            }
            alert(msg);
          }

        } catch (err) {
          console.error("Error al procesar eventos en Google Calendar:", err);
          btnProcesar.disabled = false;
          btnProcesar.textContent = textoOriginal;
          alert("Ocurrió un error al agendar los eventos en tu Google Calendar.");
        }
      };

      // Si no tenemos token concedido, abrir ventana emergente de permisos de Google
      if (gapi.client.getToken() === null) {
        tokenClientCalendar.callback = async (resp) => {
          if (resp.error !== undefined) {
            alert("No se otorgaron los permisos necesarios para acceder a tu Google Calendar.");
            return;
          }
          await ejecutarAccionCalendar();
        };
        tokenClientCalendar.requestAccessToken({ prompt: 'consent', hint: usuarioLogueado.correo });
      } else {
        ejecutarAccionCalendar();
      }
    }

    function obtenerValor(item, listaNombres) {
      if (!item) return "";
      const keys = Object.keys(item);
      for (let nombre of listaNombres) {
        const keyMatch = keys.find(k => k.trim().toLowerCase() === nombre.toLowerCase());
        if (keyMatch && item[keyMatch] !== undefined && item[keyMatch] !== null && item[keyMatch] !== "") {
          return item[keyMatch].toString().trim();
        }
      }
      return "";
    }

    function normalizarTexto(txt) {
      return txt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function obtenerSubordinadosDirectos(padre, todos) {
      const nivelPadre = parseInt(obtenerValor(padre, ["NIVEL ORGANIGRAMA", "NIVEL"])) || 99;
      const dgPadre = normalizarTexto(obtenerValor(padre, ["DIRECCIÓN GENERAL", "DIRECCION GENERAL"]));
      const daPadre = normalizarTexto(obtenerValor(padre, ["DIRECCIÓN DE ÁREA", "DIRECCION DE AREA"]));
      const curpPadre = obtenerValor(padre, ["CURP"]);

      return todos.filter(hijo => {
        const curpHijo = obtenerValor(hijo, ["CURP"]);
        if (curpPadre && curpHijo && curpPadre === curpHijo) return false;

        const nivelHijo = parseInt(obtenerValor(hijo, ["NIVEL ORGANIGRAMA", "NIVEL"])) || 99;
        const dgHijo = normalizarTexto(obtenerValor(hijo, ["DIRECCIÓN GENERAL", "DIRECCION GENERAL"]));
        const daHijo = normalizarTexto(obtenerValor(hijo, ["DIRECCIÓN DE ÁREA", "DIRECCION DE AREA"]));

        if (nivelHijo <= nivelPadre) return false;

        if (nivelPadre === 1) {
          return nivelHijo === 5 || nivelHijo === 2;
        }

        if (nivelPadre === 2) {
          return dgHijo === dgPadre && (nivelHijo === 6 || nivelHijo === 3 || nivelHijo === 4);
        }

        if (nivelPadre === 3 || nivelPadre === 4) {
          return dgHijo === dgPadre && daHijo === daPadre && nivelHijo === 7;
        }

        return false;
      });
    }

    function crearNodoHTML(persona, todos, autoExpandir = false) {
      const nombre = obtenerValor(persona, ["NOMBRE PÚBLICO", "NOMBRE COMPLETO", "NOMBRE"]);
      const puesto = obtenerValor(persona, ["FUNCIONES", "PUESTO"]);
      const nivel = obtenerValor(persona, ["NIVEL ORGANIGRAMA", "NIVEL"]);
      const dirArea = obtenerValor(persona, ["DIRECCIÓN DE ÁREA", "DIRECCION DE AREA"]);
      const dirGeneral = obtenerValor(persona, ["DIRECCIÓN GENERAL", "DIRECCION GENERAL"]);
      const subsecretaria = obtenerValor(persona, ["SUBSECRETARIA"]);
      const correo = obtenerValor(persona, ["CORREO"]);
      const ext = obtenerValor(persona, ["EXTENSIÓN", "EXTENSION"]);

      const areaTexto = dirArea || dirGeneral || subsecretaria || "SEMS";
      const subordinados = obtenerSubordinadosDirectos(persona, todos);

      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'tree-node';

      const card = document.createElement('div');
      card.className = 'card';
      
      let htmlCard = `
        <div class="card-header">
          <div>
            <h3 class="user-name">${nombre || 'Sin Nombre'}</h3>
            <p class="user-job">${puesto || 'Personal'}</p>
          </div>
          <span class="level-badge">Nivel ${nivel}</span>
        </div>
        <span class="area-badge">${areaTexto}</span>
        <div class="card-details">
          ${correo ? `<div>✉️ ${correo}</div>` : ''}
          ${ext ? `<div>📞 Ext. ${ext}</div>` : ''}
        </div>
      `;

      if (subordinados.length > 0) {
        htmlCard += `
          <button class="toggle-btn" onclick="toggleHijos(this)">
            <span class="toggle-icon">${autoExpandir ? '[ − ]' : '[ + ]'}</span>
            <span class="toggle-text">${autoExpandir ? 'Ocultar personal' : 'Ver personal a cargo'} (${subordinados.length})</span>
          </button>
        `;
      }

      card.innerHTML = htmlCard;
      nodeDiv.appendChild(card);

      if (subordinados.length > 0) {
        const containerHijos = document.createElement('div');
        containerHijos.className = `children-container ${autoExpandir ? 'open' : ''}`;
        
        subordinados.forEach(hijo => {
          containerHijos.appendChild(crearNodoHTML(hijo, todos, false));
        });

        nodeDiv.appendChild(containerHijos);
      }

      return nodeDiv;
    }

    function renderizarOrganigramaJerarquico(lista) {
      const contenedor = document.getElementById('organigramaContainer');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; color:#718096;">No se encontraron registros.</p>';
        return;
      }

      const raiz = lista.find(item => parseInt(obtenerValor(item, ["NIVEL ORGANIGRAMA", "NIVEL"])) === 1);

      if (raiz) {
        contenedor.appendChild(crearNodoHTML(raiz, lista, true));
      } else {
        lista.forEach(item => {
          contenedor.appendChild(crearNodoHTML(item, lista, false));
        });
      }
    }

    function toggleHijos(btn) {
      const node = btn.closest('.tree-node');
      const container = node.querySelector('.children-container');
      const icon = btn.querySelector('.toggle-icon');
      const text = btn.querySelector('.toggle-text');
      const countMatch = text.textContent.match(/\(\d+\)/);
      const count = countMatch ? countMatch[0] : '';

      if (container.classList.contains('open')) {
        container.classList.remove('open');
        icon.textContent = '[ + ]';
        text.textContent = `Ver personal a cargo ${count}`;
      } else {
        container.classList.add('open');
        icon.textContent = '[ − ]';
        text.textContent = `Ocultar personal ${count}`;
      }
    }

    function filtrarOrganigrama() {
      const texto = document.getElementById('searchInput').value.toLowerCase().trim();
      
      if (!texto) {
        renderizarOrganigramaJerarquico(datosGlobales);
        return;
      }

      const contenedor = document.getElementById('organigramaContainer');
      contenedor.innerHTML = '';

      const filtrados = datosGlobales.filter(item => {
        const nombre = obtenerValor(item, ["NOMBRE PÚBLICO", "NOMBRE COMPLETO", "NOMBRE"]).toLowerCase();
        const puesto = obtenerValor(item, ["FUNCIONES", "PUESTO"]).toLowerCase();
        const area = (obtenerValor(item, ["DIRECCIÓN DE ÁREA", "DIRECCION DE AREA"]) || obtenerValor(item, ["DIRECCIÓN GENERAL", "DIRECCION GENERAL"])).toLowerCase();
        return nombre.includes(texto) || puesto.includes(texto) || area.includes(texto);
      });

      if (filtrados.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; color:#718096;">No se encontraron resultados para la búsqueda.</p>';
        return;
      }

      filtrados.forEach(item => {
        contenedor.appendChild(crearNodoHTML(item, datosGlobales, false));
      });
    }
  </script>
</body>
</html>
