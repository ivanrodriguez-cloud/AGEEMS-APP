<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Icono de la pestaña (Favicon) -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ivanrodriguez-cloud/AGEEMS-APP/main/icono.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ivanrodriguez-cloud/AGEEMS-APP/main/icono.png">
  
  <meta charset="utf-8">
  <title>SEMS - Gestión Estratégica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- SDK oficial de Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --primary-orange: #FF8300;
      --primary-pink: #E5004E;
      --neutral-gray: #5B6670;
      --light-bg: #f8f9fa;
    }
    body { font-family: 'Poppins', sans-serif; background-color: var(--light-bg); color: var(--neutral-gray); margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { background: #ffffff; width: 100%; max-width: 700px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { max-width: 150px; height: auto; border-radius: 15px; }
    h1 { color: var(--primary-pink); font-size: 22px; font-weight: 600; text-align: center; margin-top: 10px; }
    .tablero-blanco { display: none; text-align: center; }
    .paginas-interes-seccion { display: none; }
    
    /* Sección Login */
    .login-container { text-align: center; padding: 20px 0; }
    
    /* Barra de usuario superior transparente */
    .user-info { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: transparent; 
      border: none; 
      padding: 0 0 15px 0; 
      margin-bottom: 10px; 
      font-size: 14px; 
    }
    .user-details {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .user-name { 
      font-weight: 600; 
      color: #333; 
      font-size: 15px;
      line-height: 1.2;
    }
    .user-role { 
      font-weight: 400; 
      color: var(--neutral-gray); 
      font-size: 13px;
      line-height: 1.2;
    }
    .btn-logout { 
      background: transparent; 
      color: var(--primary-pink); 
      border: 1px solid var(--primary-pink); 
      border-radius: 6px; 
      padding: 6px 12px; 
      cursor: pointer; 
      font-size: 12px; 
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-logout:hover { 
      background: var(--primary-pink); 
      color: #fff; 
    }

    .btn { background-color: var(--primary-pink); color: white; padding: 12px 24px; border: none; border-radius: 6px; font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; transition: background 0.3s; }
    .btn-orange { background-color: var(--primary-orange); }
    .btn-orange:hover { background-color: #e07300; }
    .btn-secundario { background-color: transparent; color: var(--neutral-gray); border: 1px solid #ccc; width: auto; margin-bottom: 20px; padding: 8px 16px; font-size: 14px; }
    
    .grid-paginas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
    .card-enlace { border: 1px solid #eee; border-radius: 10px; padding: 20px; text-align: center; text-decoration: none; color: inherit; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card-enlace:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); border-color: var(--primary-orange); }
    .card-enlace img { max-width: 120px; max-height: 80px; width: auto; height: auto; margin-bottom: 12px; object-fit: contain; }
    .card-enlace span { font-weight: 600; font-size: 16px; color: #333; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- BARRA DE INFORMACIÓN DE USUARIO LOGUEADO (ARRIBA DEL LOGO) -->
    <div id="userInfoBar" class="user-info" style="display: none;">
      <div class="user-details">
        <span id="userName" class="user-name">Cargando...</span>
        <span id="userRole" class="user-role">ROL</span>
      </div>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div class="header">
      <img src="icono.png" alt="Logo SEMS">
      <h1>SEMS - Gestión Estratégica</h1>
    </div>

    <!-- SECCIÓN DE LOGIN CON GOOGLE -->
    <div id="seccionLogin" class="login-container">
      <p style="margin-bottom: 20px; font-weight: 400;">Inicia sesión con tu cuenta de Google para continuar</p>
      
      <div id="g_id_onload"
           data-client_id="287359960751-l4p24dep46nrtc41if0n8naabn1vi1lu.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_select="false">
      </div>

      <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large"></div>
      
      <p id="mensajeLogin" style="color: red; margin-top: 15px; font-size: 14px;"></p>
    </div>

    <!-- TABLERO PRINCIPAL DE BOTONES -->
    <div id="tablero" class="tablero-blanco">
      
      <button id="btnIngresoPapeleria" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='IngresoPapeleria.html'">
        Ingreso de Papelería
      </button> 
      <button id="btnSolicitudPapeleria" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='SolicitudPapeleria.html'">
        Solicitud de Papelería
      </button>        
      <button id="btnIngresoConsumibles" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='IngresoConsumibles.html'">
        Ingreso de Consumible
      </button> 
      <button id="btnCoffeeBreak" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='coffeeBreak.html'">
        Solicitud de Coffee Break
      </button>
      <button id="btnOrganigrama" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='organigrama.html'">
        Organigrama Interactivo
      </button>
      <button id="btnPaginasInteres" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="mostrarPaginasInteres()">
        Páginas de interés
      </button>
      <button id="btnTableroEscuelas" class="btn btn-orange" style="margin-bottom: 15px; display: none;" onclick="location.href='TableroEscuelas.html'">
        Tablero de Control y Estadística
      </button>
    </div>

    <!-- SECCIÓN DE PÁGINAS DE INTERÉS -->
    <div id="paginasInteres" class="paginas-interes-seccion">
      <button class="btn btn-secundario" onclick="mostrarTablero()">← Volver al Menú</button>
      <h1 style="text-align: left; margin-bottom: 20px;">Páginas de interés</h1>
      <div class="grid-paginas">
        <!-- BOTÓN SIGE - INFEJAL -->
        <a href="https://sinfejal.jalisco.gob.mx/sige" target="_blank" class="card-enlace">
          <img src="INFEJAL.png" alt="Logo SIGE">
          <span>SIGE - INFEJAL</span>
        </a>
        
        <!-- BOTÓN CONSULTA PÚBLICA - SIOP -->
        <a href="https://obrastrasparencia.jalisco.gob.mx/secip/obrastransparencia" target="_blank" class="card-enlace">
          <img src="SIOP.png" alt="Logo SIOP">
          <span>Consulta Pública - SIOP</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby67S5Ong7-MnmBHpwWw_z5IWG-jMsm0GNsbre85vjiU4PFIXBYcVWVbwi2UZ7IgDy9xg/exec";

    function handleCredentialResponse(response) {
      document.getElementById('mensajeLogin').innerText = "Verificando permisos...";
      const payload = parseJwt(response.credential);
      const userEmail = payload.email;

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        body: JSON.stringify({ email: userEmail })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          sessionStorage.setItem("userSession", JSON.stringify(data.user));
          inicializarVistaSesion(data.user);
        } else {
          document.getElementById('mensajeLogin').innerText = data.message;
        }
      })
      .catch(err => {
        console.error("Error al validar con Apps Script:", err);
        document.getElementById('mensajeLogin').innerText = "Error de conexión con el servidor.";
      });
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => 
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
      return JSON.parse(jsonPayload);
    }

    function inicializarVistaSesion(user) {
      document.getElementById('seccionLogin').style.display = 'none';
      document.getElementById('userInfoBar').style.display = 'flex';
      document.getElementById('userName').innerText = user.nombre;
      document.getElementById('userRole').innerText = user.rol;
      
      aplicarPermisosRol(user.rol);
      mostrarTablero();
    }

    // Configuración de visibilidad de los botones según el ROL
    function aplicarPermisosRol(rol) {
      const rolNormalizado = rol ? rol.toString().toUpperCase() : "";

      // Ocultar todos los botones inicialmente
      document.getElementById('btnIngresoPapeleria').style.display = 'none';
      document.getElementById('btnSolicitudPapeleria').style.display = 'none';
      document.getElementById('btnIngresoConsumibles').style.display = 'none';
      document.getElementById('btnCoffeeBreak').style.display = 'none';
      document.getElementById('btnOrganigrama').style.display = 'none';
      document.getElementById('btnPaginasInteres').style.display = 'none';
      document.getElementById('btnTableroEscuelas').style.display = 'none';

      if (rolNormalizado === "ADMINISTRADOR") {
        // ADMINISTRADOR: Visualiza todos los botones
        document.getElementById('btnIngresoPapeleria').style.display = 'block';
        document.getElementById('btnSolicitudPapeleria').style.display = 'block';
        document.getElementById('btnIngresoConsumibles').style.display = 'block';
        document.getElementById('btnCoffeeBreak').style.display = 'block';
        document.getElementById('btnOrganigrama').style.display = 'block';
        document.getElementById('btnPaginasInteres').style.display = 'block';
        document.getElementById('btnTableroEscuelas').style.display = 'block';

      } else if (rolNormalizado === "DIRECTOR") {
        // DIRECTOR: Solicitud de Papelería, Solicitud de Coffee Break, Organigrama, Páginas de interés y Tablero
        document.getElementById('btnSolicitudPapeleria').style.display = 'block';
        document.getElementById('btnCoffeeBreak').style.display = 'block';
        document.getElementById('btnOrganigrama').style.display = 'block';
        document.getElementById('btnPaginasInteres').style.display = 'block';
        document.getElementById('btnTableroEscuelas').style.display = 'block';
 
      } else if (rolNormalizado === "USUARIO") {
        // USUARIO: Solicitud de Papelería, Solicitud de Coffee Break, Organigrama y Páginas de interés
        document.getElementById('btnSolicitudPapeleria').style.display = 'block';
        document.getElementById('btnCoffeeBreak').style.display = 'block';
        document.getElementById('btnOrganigrama').style.display = 'block';
        document.getElementById('btnPaginasInteres').style.display = 'block';
        
      } else if (rolNormalizado === "VISUALIZADOR") {
        // VISUALIZADOR: Organigrama Interactivo y Páginas de interés
        document.getElementById('btnOrganigrama').style.display = 'block';
        document.getElementById('btnPaginasInteres').style.display = 'block';
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem("userSession");
      location.reload();
    }

    function mostrarTablero() {
      document.getElementById('tablero').style.display = 'block';
      document.getElementById('paginasInteres').style.display = 'none';
    }

    function mostrarPaginasInteres() {
      document.getElementById('tablero').style.display = 'none';
      document.getElementById('paginasInteres').style.display = 'block';
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedSession = sessionStorage.getItem("userSession");
      if (savedSession) {
        const user = JSON.parse(savedSession);
        inicializarVistaSesion(user);
      }
    });
  </script>
</body>
</html>
